name: build-amdgpu-dkms-test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ktool/ktool/build_amdgpu_dkms.py'
      - 'ktool/ktool/stage_amdgpu.py'
      - 'ktool/pyproject.toml'

jobs:
  build-amdgpu-dkms-test:
    name: build-amdgpu-dkms-test
    runs-on: ubuntu-24.04
    env:
      AMDGPU_REF: rocm-6.2.4

    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Install ktool
        run: pip install ./ktool

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential dkms dwarves

      - name: Install pinned kernel headers
        env:
          KVER: 6.8.0-146-generic
          PKGVER: 6.8.0-146.146
        run: |
          # Download headers directly from the Ubuntu archive so CI is not
          # affected by runner kernel updates. 6.8.0-147+ changed
          # pci_resize_resource signature and breaks rocm-6.2.4 amdgpu.
          BASE=http://security.ubuntu.com/ubuntu/pool/main/l/linux
          mkdir -p /tmp/khdrs
          wget -q "${BASE}/linux-headers-${KVER}_${PKGVER}_amd64.deb" \
                  "${BASE}/linux-headers-6.8.0-146_${PKGVER}_all.deb" \
               -P /tmp/khdrs/
          sudo dpkg -i /tmp/khdrs/*.deb
          echo "kver=${KVER}" >> "$GITHUB_ENV"

      - name: Cache staged amdgpu source
        id: amdgpu-cache
        uses: actions/cache@v4
        with:
          path: /tmp/amdgpu-staged
          key: amdgpu-staged-${{ env.AMDGPU_REF }}

      - name: Stage amdgpu source from tarball
        if: steps.amdgpu-cache.outputs.cache-hit != 'true'
        run: ktool stage-amdgpu ${AMDGPU_REF} /tmp/amdgpu-staged

      - name: Run ktool build-amdgpu-dkms (no install)
        run: |
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ env.kver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install

      - name: Verify modules were built
        run: |
          dkms status | grep amdgpu
          find /var/lib/dkms/amdgpu -name "*.ko*" | sort

      - name: Force-rebuild path (idempotency)
        run: |
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ env.kver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install \
            --force

      - name: Build source DKMS tarball (--mkdeb)
        run: |
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ env.kver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install \
            --mkdeb

      - name: Verify source tarball produced
        run: ls -lh /var/lib/dkms/amdgpu/*/tarball/*.dkms 2>/dev/null || \
             find /var/lib/dkms/amdgpu -name "*.dkms" -o -name "*.tar.gz" | sort

      - name: Print dkms make.log on failure
        if: failure()
        run: find /var/lib/dkms/amdgpu -name "make.log" -exec cat {} +

      - name: Build with amdgpu-no-large-bar patches
        run: |
          ktool stage-amdgpu ${AMDGPU_REF} /tmp/amdgpu-staged-patched
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ env.kver }} \
            --build-src /tmp/amdgpu-staged-patched \
            --patch-dirs ./patches/amdgpu-no-large-bar \
            --no-install \
            --mkdeb \
            --force
