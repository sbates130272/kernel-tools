name: build-amdgpu-dkms-test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ktool/ktool/build_amdgpu_dkms.py'
      - 'ktool/ktool/stage_amdgpu.py'
      - 'ktool/pyproject.toml'

jobs:
  build-amdgpu-dkms-test:
    name: build-amdgpu-dkms-test
    runs-on: ubuntu-24.04
    env:
      AMDGPU_REF: rocm-6.2.4

    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Install ktool
        run: pip install ./ktool

      - name: Detect available kernel headers version
        id: kver
        run: |
          KVER=$(apt-cache search 'linux-headers-6\.8\.' | grep generic | \
                 sort -V | tail -1 | awk '{print $1}' | sed 's/linux-headers-//')
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            dkms \
            dwarves \
            linux-headers-${{ steps.kver.outputs.kver }}

      - name: Stage amdgpu source from tarball
        run: ktool stage-amdgpu ${AMDGPU_REF} /tmp/amdgpu-staged

      - name: Run ktool build-amdgpu-dkms (no install)
        run: |
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install

      - name: Verify modules were built
        run: |
          dkms status | grep amdgpu
          find /var/lib/dkms/amdgpu -name "*.ko*" | sort

      - name: Force-rebuild path (idempotency)
        run: |
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install \
            --force

      - name: Build source DKMS .deb (--mkdeb)
        run: |
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install \
            --mkdeb

      - name: Verify .deb produced and has correct structure
        run: |
          ls -lh amdgpu-dkms-*.deb
          dpkg-deb --info amdgpu-dkms-*.deb | grep -E "Architecture: all|Package:|Depends:"
          dpkg-deb --contents amdgpu-dkms-*.deb | grep "usr/src/amdgpu-"

      - name: Build with amdgpu-no-large-bar patches
        run: |
          ktool stage-amdgpu ${AMDGPU_REF} /tmp/amdgpu-staged-patched
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged-patched \
            --patch-dirs ./patches/amdgpu-no-large-bar \
            --no-install \
            --mkdeb \
            --force
