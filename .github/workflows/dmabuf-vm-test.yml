name: dmabuf-vm-test

# Full end-to-end VM test is too slow (~30 min kernel build) for every PR.
# Trigger manually via workflow_dispatch, or on pushes to branches that touch
# the DMA-BUF scripts and configs.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'scripts/run-dmabuf-vm-test.sh'
      - 'scripts/build-latest-io-uring-dmabuf-kernel'
      - 'scripts/build-remote'
      - 'config-scripts/config-default'
      - 'useful-configs/config-x86_64-p2pdma-qemu'
      - 'userspace/amdgpu-dmabuf-io/**'

jobs:
  dmabuf-vm-config-test:
    name: dmabuf-vm-config-test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out kernel-tools
        uses: actions/checkout@v7.0.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Install qemu-tool and kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            cloud-image-utils \
            flex \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            nasm \
            ovmf \
            pahole \
            qemu-system-x86 \
            qemu-utils
          pip install qemu-tool

      - name: Clone the DMA-BUF kernel source (depth 1)
        run: |
          git clone --depth 1 \
            https://github.com/anuj7781/linux-kernel \
            -b anuj/fs-dmabuf-rfc-v11-desc-v2 \
            ./src

      - name: Generate a base config from the DMA-BUF kernel tree
        run: make defconfig && mv .config test-config
        working-directory: ./src

      # Use qemu-tool gen-vm in dry-run-equivalent mode: build the cloud-init
      # seed and overlay, but do not start QEMU.  We validate the image is
      # created successfully and that the build-remote config step applies the
      # expected knobs, without incurring the cost of booting a VM or
      # compiling the kernel.
      - name: Generate VM image with qemu-tool gen-vm
        run: |
          mkdir -p /tmp/qemu-images
          # Download the Ubuntu cloud image (noble; resolute not yet on runners)
          wget -q -O /tmp/qemu-images/noble-server-cloudimg-amd64.img \
            https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          # Generate the VM overlay + cloud-init seed.
          # We inject the runner's own key so the SSH alias step has something
          # to reference; --force rebuilds if the image already exists.
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q || true
          qemu-tool gen-vm \
            --vm-name    dmabuf-ci \
            --images     /tmp/qemu-images \
            --vcpus      2 \
            --vmem       2048 \
            --ssh-port   2222 \
            --release    noble \
            --ssh-key-file ~/.ssh/id_ed25519.pub \
            --backing-file /tmp/qemu-images/noble-server-cloudimg-amd64.img \
            --force

      - name: Run build-remote config step only (NO_BUILD NO_INSTALL)
        run: |
          # build-remote must run from inside the kernel source tree.
          # In localhost mode it uses the local .config (test-config) rather
          # than SSH-fetching from a real VM.
          cp test-config src/test-config
          cd src
          REMOTE_NAME=localhost \
          CONFIG=test-config \
          CONFIG_SCRIPT=default \
          NO_BUILD=true \
          NO_INSTALL=true \
          LABEL=-dmabuf-ci \
            ../scripts/build-remote

      - name: Verify config knobs applied by config-default
        run: |
          grep CONFIG_BLK_DEV_NVME src/.config
          grep CONFIG_NVME_CORE    src/.config
          grep CONFIG_9P_FS        src/.config

      - name: Verify XFS is enabled in the DMA-BUF kernel config
        run: grep CONFIG_XFS_FS src/.config
