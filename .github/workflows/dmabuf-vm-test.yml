name: dmabuf-vm-test

# Runs run-this.sh inside the QEMU CI container. That script does everything:
# pull qcow2, boot VM with rocjitsu GPU (large-BAR) + NVMe, build kernel,
# build amdgpu-dkms, install into VM, probe GPU, run raw-NVMe + XFS P2P tests.

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'patches/dmabuf-72x-backport/**'
      - 'patches/amdgpu-72x-compat/**'
      - 'userspace/amdgpu-dmabuf-io/**'
      - 'config-scripts/config-amdgpu-dkms'
      - 'scripts/build-amdgpu-dkms'
      - 'run-this.sh'
      - '.github/workflows/dmabuf-vm-test.yml'

env:
  VM_IMAGES_DIR: /var/lib/qemu-tool/images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dmabuf-vm-test:
    name: dmabuf-vm-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261016.g9ef1ed8-qemu11.1.2-vfu.8039244
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool

    steps:
      - name: Check out kernel-tools
        uses: actions/checkout@v4.3.1

      - name: Check out qemu-minimal (provides compose stacks)
        uses: actions/checkout@v4.3.1
        with:
          repository: sbates130272/qemu-minimal
          path: qemu-minimal

      - name: Set up git identity
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@github-actions"
          git config --global user.name "CI"

      - name: Install kernel build deps
        run: |
          apt-get update -qq
          apt-get install -y \
            bc bison build-essential debhelper flex iproute2 libdw-dev \
            libelf-dev libncurses-dev libssl-dev nasm pahole

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: /var/cache/pip-ci
          key: pip-qemu-tool-v2

      - name: Install qemu-tool
        run: PIP_CACHE_DIR=/var/cache/pip-ci pip install --break-system-packages qemu-tool

      - name: Cache kernel debs
        id: kernel-deb-cache
        uses: actions/cache@v4
        with:
          path: /var/cache/kernel-debs
          key: kernel-debs-v7.2.4-${{ hashFiles('patches/dmabuf-72x-backport/*.patch', 'config-scripts/config-amdgpu-dkms') }}

      - name: Restore cached kernel debs into /tmp
        if: steps.kernel-deb-cache.outputs.cache-hit == 'true'
        run: cp /var/cache/kernel-debs/*.deb /tmp/ 2>/dev/null && echo "Kernel debs restored — build will be skipped" || true

      - name: Resolve Docker bridge IP for VM SSH
        run: |
          # In a container job, localhost doesn't reach QEMU — use the bridge IP.
          # Try ip route first; fall back to parsing /proc/net/route.
          IP=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}') || true
          if [ -z "${IP}" ]; then
            IP=$(awk 'NR>1 && $2=="00000000" {
              hex=$3
              printf "%d.%d.%d.%d\n",
                strtonum("0x"substr(hex,7,2)),
                strtonum("0x"substr(hex,5,2)),
                strtonum("0x"substr(hex,3,2)),
                strtonum("0x"substr(hex,1,2))
            }' /proc/net/route | head -1) || true
          fi
          echo "VM_SSH_HOST=${IP}" >> "$GITHUB_ENV"
          echo "VM SSH host: ${IP}"

      - name: Run run-this.sh
        env:
          QEMU_MINIMAL_DIR: ${{ github.workspace }}/qemu-minimal
          KERNEL_SRC: /tmp/linux-dmabuf
          KERNEL_BRANCH: v7.2.4
        run: |
          chmod +x run-this.sh
          ./run-this.sh

      - name: Save kernel debs to cache
        if: steps.kernel-deb-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /var/cache/kernel-debs
          cp /tmp/linux-image-*.deb /tmp/linux-headers-*.deb /var/cache/kernel-debs/ 2>/dev/null || true
