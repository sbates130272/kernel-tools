name: dmabuf-vm-test

# Runs ktool dmabuf-test inside the QEMU CI container. That subcommand does
# everything: pull qcow2, boot VM with rocjitsu GPU (large-BAR) + NVMe, build
# kernel, build amdgpu-dkms, install into VM, probe GPU, run raw-NVMe + XFS
# P2P tests.

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'ktool/**'
      - 'patches/dmabuf-72x-backport/**'
      - 'patches/amdgpu-72x-compat/**'
      - 'userspace/amdgpu-dmabuf-io/**'
      - 'config-scripts/config-amdgpu-dkms'
      - '.github/workflows/dmabuf-vm-test.yml'

env:
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  QCOW2_TAG: "20261022.g1177df0-vm.resolute-ernic-rocjitsu-qm.c079195-qcow2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dmabuf-vm-test:
    name: dmabuf-vm-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261016.g9ef1ed8-qemu11.1.2-vfu.8039244
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool

    steps:
      - name: Check out kernel-tools
        uses: actions/checkout@v4.3.1

      - name: Check out qemu-minimal (provides compose stacks)
        uses: actions/checkout@v4.3.1
        with:
          repository: sbates130272/qemu-minimal
          path: qemu-minimal

      - name: Set up git identity
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@github-actions"
          git config --global user.name "CI"

      - name: Install kernel build deps
        run: |
          apt-get update -qq
          apt-get install -y \
            bc bison build-essential ccache debhelper flex gawk iproute2 \
            dkms kmod libdw-dev libelf-dev libncurses-dev libssl-dev nasm \
            pahole rsync

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: /var/cache/pip-ci
          key: pip-ktool-v1

      - name: Install ktool (includes qemu-tool dependency)
        run: PIP_CACHE_DIR=/var/cache/pip-ci pip install --break-system-packages ./ktool

      - name: Cache VM backing image
        id: qcow2-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VM_IMAGES_DIR }}
          key: qcow2-${{ env.QCOW2_TAG }}

      - name: Cache ccache (kernel build acceleration)
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-kernel-7.2.4-${{ hashFiles('patches/dmabuf-72x-backport/*.patch', 'config-scripts/config-amdgpu-dkms') }}
          restore-keys: |
            ccache-kernel-7.2.4-

      - name: Cache kernel debs
        id: kernel-deb-cache
        uses: actions/cache@v4
        with:
          path: /var/cache/kernel-debs
          key: kernel-debs-v7.2.4-${{ hashFiles('patches/dmabuf-72x-backport/*.patch', 'config-scripts/config-amdgpu-dkms') }}

      - name: Cache DKMS modules
        id: dkms-cache
        uses: actions/cache@v4
        with:
          path: /var/cache/dkms-modules
          key: dkms-amdgpu-7.1.9-${{ hashFiles('patches/dmabuf-72x-backport/*.patch', 'patches/amdgpu-72x-compat/*.patch', 'config-scripts/config-amdgpu-dkms') }}

      - name: Restore cached kernel debs into /tmp
        if: steps.kernel-deb-cache.outputs.cache-hit == 'true'
        run: cp /var/cache/kernel-debs/*.deb /tmp/ 2>/dev/null && echo "Kernel debs restored — build will be skipped" || true

      - name: Restore cached DKMS modules
        if: steps.dkms-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p /var/lib/dkms
          cp -a /var/cache/dkms-modules/. /var/lib/dkms/ 2>/dev/null && echo "DKMS modules restored" || true

      - name: Resolve Docker bridge IP for VM SSH
        run: |
          # In a container job, localhost doesn't reach QEMU — use the bridge IP.
          IP=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}') || true
          if [ -z "${IP}" ]; then
            IP=$(awk 'NR>1 && $2=="00000000" {
              hex=$3
              printf "%d.%d.%d.%d\n",
                strtonum("0x"substr(hex,7,2)),
                strtonum("0x"substr(hex,5,2)),
                strtonum("0x"substr(hex,3,2)),
                strtonum("0x"substr(hex,1,2))
            }' /proc/net/route | head -1) || true
          fi
          echo "VM_SSH_HOST=${IP}" >> "$GITHUB_ENV"
          echo "VM SSH host: ${IP}"

      - name: Run ktool dmabuf-test
        env:
          KERNEL_SRC: /tmp/linux-dmabuf
          KERNEL_BRANCH: v7.2.4
          CCACHE_DIR: /root/.ccache
          VM_SSH_PORT: "2222"
        run: |
          ktool dmabuf-test --ssh-host "$VM_SSH_HOST" --ssh-port 2222

      - name: Populate kernel deb cache path
        if: always() && steps.kernel-deb-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /var/cache/kernel-debs
          find /tmp -maxdepth 1 \( -name 'linux-image-*-dmabuf-72x*.deb' -o -name 'linux-headers-*-dmabuf-72x*.deb' \) \
            ! -name '*-dbg_*' | xargs -r cp -t /var/cache/kernel-debs/ || true

      - name: Save kernel debs to cache
        if: always() && steps.kernel-deb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /var/cache/kernel-debs
          key: kernel-debs-v7.2.4-${{ hashFiles('patches/dmabuf-72x-backport/*.patch', 'config-scripts/config-amdgpu-dkms') }}

      - name: Populate DKMS modules cache path
        if: always() && steps.dkms-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /var/cache/dkms-modules
          cp -a /var/lib/dkms/. /var/cache/dkms-modules/ 2>/dev/null || true

      - name: Save DKMS modules to cache
        if: always() && steps.dkms-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /var/cache/dkms-modules
          key: dkms-amdgpu-7.1.9-${{ hashFiles('patches/dmabuf-72x-backport/*.patch', 'patches/amdgpu-72x-compat/*.patch', 'config-scripts/config-amdgpu-dkms') }}
