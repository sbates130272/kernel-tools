name: dmabuf-vm-test

# Boots a real KVM-accelerated QEMU VM with one emulated NVMe device, runs
# scripts/build-remote to install the DMA-BUF kernel (Anuj Gupta's
# fs-dmabuf-rfc-v11-desc-v2 branch: io_uring v11 + iomap/XFS support), then
# verifies the expected config knobs and NVMe device are present.
#
# The kernel build takes ~30 minutes; trigger manually or on pushes that
# touch the DMA-BUF-related files.

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'scripts/run-dmabuf-vm-test.sh'
      - 'scripts/build-latest-io-uring-dmabuf-kernel'
      - 'scripts/build-remote'
      - 'config-scripts/config-default'
      - 'useful-configs/config-x86_64-p2pdma-qemu'
      - 'userspace/amdgpu-dmabuf-io/**'
      - '.github/workflows/dmabuf-vm-test.yml'

env:
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  VM_NAME: dmabuf-test
  VM_SSH_PORT: 2222
  KERNEL_REMOTE: https://github.com/anuj7781/linux-kernel
  KERNEL_BRANCH: anuj/fs-dmabuf-rfc-v11-desc-v2
  LABEL: -dmabuf-v11-fs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dmabuf-vm-test:
    name: dmabuf-vm-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261007.g677e113-qemu11.1.2-vfu.8039244
      options: --device /dev/kvm

    steps:
      - name: Check out kernel-tools
        uses: actions/checkout@v4.3.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Verify KVM is available
        run: |
          test -c /dev/kvm || { echo "::error::/dev/kvm missing"; exit 1; }
          python3 -c "import os, fcntl; fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00, 0)" \
            || { echo "::error::/dev/kvm present but KVM_GET_API_VERSION failed"; exit 1; }
          echo "KVM available: $(ls -l /dev/kvm)"

      - name: Install kernel build dependencies
        run: |
          apt-get update -qq
          apt-get install -y \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            nasm \
            pahole

      - name: Generate SSH key-pair
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -q -f "$HOME/.ssh/id_ed25519" -N ""
          [ "$HOME" = /root ] || { rm -rf /root/.ssh && ln -s "$HOME/.ssh" /root/.ssh; }

      - name: Install qemu-tool
        run: pip install --break-system-packages qemu-tool

      - name: Cache cloud image
        uses: actions/cache@v4
        with:
          path: ${{ env.VM_IMAGES_DIR }}/*-server-cloudimg-*.img
          key: cloud-img-amd64-noble-dmabuf

      - name: Ensure images directory exists
        run: mkdir -p "$VM_IMAGES_DIR" && chmod 777 "$VM_IMAGES_DIR"

      - name: Generate VM image with qemu-tool gen-vm
        uses: sbates130272/qemu-tool-action@v1
        with:
          operation: gen-vm
          vm-name: ${{ env.VM_NAME }}
          images-dir: ${{ env.VM_IMAGES_DIR }}
          release: noble
          ssh-key-file: ${{ env.HOME }}/.ssh/id_ed25519.pub
          extra-args: --vcpus 4 --vmem 4096 --ssh-port ${{ env.VM_SSH_PORT }} --force

      - name: Start VM with one emulated NVMe device
        run: |
          qemu-tool run-vm \
            --vm-name  "$VM_NAME" \
            --images   "$VM_IMAGES_DIR" \
            --ssh-port "$VM_SSH_PORT" \
            --nvme     1 \
            > /tmp/run-vm.log 2>&1 &
          echo "QEMU started in background"

      - name: Wait for VM SSH (180s)
        run: |
          elapsed=0
          while [ $elapsed -lt 180 ]; do
            if ssh -i "$HOME/.ssh/id_ed25519" \
                   -o ConnectTimeout=2 \
                   -o BatchMode=yes \
                   -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null \
                   -p "$VM_SSH_PORT" ubuntu@localhost true 2>/dev/null; then
              echo "VM ready after ${elapsed}s"
              exit 0
            fi
            sleep 3; elapsed=$((elapsed + 3))
          done
          echo "::error::VM did not respond on SSH within 180s"
          cat /tmp/run-vm.log
          exit 1

      - name: Verify NVMe device is present in stock kernel
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p "$VM_SSH_PORT" ubuntu@localhost \
              "lsblk -d -o NAME,MODEL,SIZE | grep nvme"
          echo "NVMe device confirmed in guest"

      - name: Add SSH config alias for the VM
        run: |
          cat >> "$HOME/.ssh/config" <<EOF

          Host $VM_NAME
              HostName localhost
              Port $VM_SSH_PORT
              User ubuntu
              IdentityFile $HOME/.ssh/id_ed25519
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Clone DMA-BUF kernel source (depth 1)
        run: |
          git clone --depth 1 "$KERNEL_REMOTE" -b "$KERNEL_BRANCH" ./src

      - name: Fetch VM boot config for build-remote
        run: |
          # build-remote fetches /boot/<CONFIG> from the remote via scp.
          REMOTE_UNAME=$(ssh "$VM_NAME" uname -r)
          echo "VM_CONFIG=config-${REMOTE_UNAME}" >> "$GITHUB_ENV"
          echo "Remote uname: $REMOTE_UNAME"

      - name: Run build-remote (full kernel build + install into VM)
        run: |
          cd src
          REMOTE_NAME="$VM_NAME" \
          CONFIG="$VM_CONFIG" \
          CONFIG_SCRIPT=default \
          LABEL="$LABEL" \
            ../scripts/build-remote

      # build-remote reboots the VM as its last step; wait for it to come back.
      - name: Wait for VM to reboot (240s)
        run: |
          sleep 15
          elapsed=0
          while [ $elapsed -lt 240 ]; do
            if ssh -i "$HOME/.ssh/id_ed25519" \
                   -o ConnectTimeout=2 \
                   -o BatchMode=yes \
                   -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null \
                   -p "$VM_SSH_PORT" ubuntu@localhost true 2>/dev/null; then
              echo "VM back after ${elapsed}s"
              exit 0
            fi
            sleep 5; elapsed=$((elapsed + 5))
          done
          echo "::error::VM did not come back after reboot within 240s"
          exit 1

      - name: Verify DMA-BUF kernel is running
        run: |
          UNAME=$(ssh -i "$HOME/.ssh/id_ed25519" \
                      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                      -p "$VM_SSH_PORT" ubuntu@localhost \
                      "uname -r")
          echo "Kernel: $UNAME"
          echo "$UNAME" | grep -q "${LABEL#-}" \
            || echo "::warning::label '${LABEL}' not found in uname '$UNAME' — may have booted old kernel"

      - name: Verify DMA-BUF config knobs present
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p "$VM_SSH_PORT" ubuntu@localhost \
              "zgrep -E 'CONFIG_(XFS_FS|BLK_DEV_NVME|NVME_CORE|9P_FS)' /boot/config-\$(uname -r)"

      - name: Verify NVMe device still present after kernel change
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p "$VM_SSH_PORT" ubuntu@localhost \
              "lsblk -d -o NAME,MODEL,SIZE | grep nvme"
          echo "NVMe device confirmed after kernel install"

      - name: Print run-vm log on failure
        if: failure()
        run: cat /tmp/run-vm.log || true
