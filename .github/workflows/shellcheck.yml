name: shellcheck

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on remaining shell scripts
        run: |
          shellcheck -x \
            scripts/release.sh
