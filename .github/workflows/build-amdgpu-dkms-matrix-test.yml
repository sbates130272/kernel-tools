name: build-amdgpu-dkms-matrix-test

# Matrix-driven variant covering multiple (AMDGPU_REF, kernel, patch-series)
# combinations in parallel.  Extend the matrix to add new refs or patch series.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ktool/ktool/build_amdgpu_dkms.py'
      - 'ktool/ktool/stage_amdgpu.py'
      - 'patches/amdgpu-no-large-bar/**'
      - 'ktool/pyproject.toml'

jobs:
  build-amdgpu-dkms-matrix-test:
    name: "${{ matrix.amdgpu-ref }} / ${{ matrix.kernel-pattern }} / ${{ matrix.patch-dirs || 'no-patches' }}"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - amdgpu-ref: rocm-6.2.4
            kernel-pattern: '6\.8\.'
            kernel-flavour: generic
            patch-dirs: ''

          - amdgpu-ref: therock-7.14
            kernel-pattern: '6\.8\.'
            kernel-flavour: generic
            patch-dirs: ''

          - amdgpu-ref: therock-7.14
            kernel-pattern: '6\.8\.'
            kernel-flavour: generic
            patch-dirs: './patches/amdgpu-no-large-bar'

    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Install ktool
        run: pip install ./ktool

      - name: Detect available kernel headers version
        id: kver
        run: |
          KVER=$(apt-cache search "linux-headers-${{ matrix.kernel-pattern }}" | \
                 grep "${{ matrix.kernel-flavour }}" | \
                 sort -V | tail -1 | awk '{print $1}' | sed 's/linux-headers-//')
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            dkms \
            dwarves \
            linux-headers-${{ steps.kver.outputs.kver }}

      - name: Stage amdgpu source from tarball
        run: ktool stage-amdgpu ${{ matrix.amdgpu-ref }} /tmp/amdgpu-staged

      - name: Run ktool build-amdgpu-dkms
        run: |
          PATCH_ARGS=""
          if [ -n "${{ matrix.patch-dirs }}" ]; then
            PATCH_ARGS="--patch-dirs ${{ matrix.patch-dirs }}"
          fi
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install \
            $PATCH_ARGS

      - name: Verify modules were built
        run: |
          dkms status | grep amdgpu
          find /var/lib/dkms/amdgpu -name "*.ko*" | sort

      - name: Build source DKMS .deb (--mkdeb)
        run: |
          PATCH_ARGS=""
          if [ -n "${{ matrix.patch-dirs }}" ]; then
            PATCH_ARGS="--patch-dirs ${{ matrix.patch-dirs }}"
          fi
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install \
            --mkdeb \
            $PATCH_ARGS

      - name: Verify .deb is Architecture:all with source tree
        run: |
          ls -lh amdgpu-dkms-*.deb
          dpkg-deb --info amdgpu-dkms-*.deb | grep -E "Architecture: all|Package:|Depends:"
          dpkg-deb --contents amdgpu-dkms-*.deb | grep "usr/src/amdgpu-"
