name: build-amdgpu-dkms-matrix-test

# Matrix-driven variant covering multiple (AMDGPU_REF, kernel, patch-series)
# combinations in parallel.  Extend the matrix to add new refs or patch series.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ktool/ktool/build_amdgpu_dkms.py'
      - 'ktool/ktool/stage_amdgpu.py'
      - 'patches/amdgpu-no-large-bar/**'
      - 'ktool/pyproject.toml'

jobs:
  build-amdgpu-dkms-matrix-test:
    name: "${{ matrix.amdgpu-ref }} / ${{ matrix.kernel-ver }} / ${{ matrix.patch-dirs || 'no-patches' }}"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - amdgpu-ref: rocm-6.2.4
            kernel-ver: 6.8.0-146-generic
            kernel-pkg-ver: 6.8.0-146.146
            patch-dirs: ''

          - amdgpu-ref: therock-7.14
            kernel-ver: 6.8.0-149-generic
            kernel-pkg-ver: 6.8.0-149.149
            patch-dirs: ''

          - amdgpu-ref: therock-7.14
            kernel-ver: 6.8.0-149-generic
            kernel-pkg-ver: 6.8.0-149.149
            patch-dirs: './patches/amdgpu-no-large-bar'

    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Install ktool
        run: pip install ./ktool

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential dkms dwarves

      - name: Install pinned kernel headers
        env:
          KVER: ${{ matrix.kernel-ver }}
          PKGVER: ${{ matrix.kernel-pkg-ver }}
        run: |
          # Download headers directly from the Ubuntu archive — independent of
          # whatever kernel the runner happens to be running.
          KVER_BASE="${KVER%%-generic}"
          BASE=http://security.ubuntu.com/ubuntu/pool/main/l/linux
          mkdir -p /tmp/khdrs
          wget -q "${BASE}/linux-headers-${KVER}_${PKGVER}_amd64.deb" \
                  "${BASE}/linux-headers-${KVER_BASE}_${PKGVER}_all.deb" \
               -P /tmp/khdrs/
          sudo dpkg -i /tmp/khdrs/*.deb

      - name: Stage amdgpu source from tarball
        run: ktool stage-amdgpu ${{ matrix.amdgpu-ref }} /tmp/amdgpu-staged

      - name: Run ktool build-amdgpu-dkms
        run: |
          PATCH_ARGS=""
          if [ -n "${{ matrix.patch-dirs }}" ]; then
            PATCH_ARGS="--patch-dirs ${{ matrix.patch-dirs }}"
          fi
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ matrix.kernel-ver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install \
            $PATCH_ARGS

      - name: Verify modules were built
        run: |
          dkms status | grep amdgpu
          find /var/lib/dkms/amdgpu -name "*.ko*" | sort

      - name: Build source DKMS tarball (--mkdeb)
        run: |
          PATCH_ARGS=""
          if [ -n "${{ matrix.patch-dirs }}" ]; then
            PATCH_ARGS="--patch-dirs ${{ matrix.patch-dirs }}"
          fi
          ktool build-amdgpu-dkms \
            --kernel-ver ${{ matrix.kernel-ver }} \
            --build-src /tmp/amdgpu-staged \
            --no-install \
            --mkdeb \
            $PATCH_ARGS

      - name: Verify source tarball produced
        run: find /var/lib/dkms/amdgpu -name "*.dkms" -o -name "*.tar.gz" | sort

      - name: Print dkms make.log on failure
        if: failure()
        run: find /var/lib/dkms/amdgpu -name "make.log" -exec cat {} +
