name: build-amdgpu-dkms-matrix-test

# A matrix-driven variant of build-amdgpu-dkms-test that covers multiple
# (AMDGPU_REF, kernel, patch-series) combinations in parallel.  Extend the
# matrix to add new refs or patch series without touching the job logic.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-amdgpu-dkms'
      - 'patches/amdgpu-no-large-bar/**'

jobs:
  build-amdgpu-dkms-matrix-test:
    name: "${{ matrix.amdgpu-ref }} / ${{ matrix.kernel-pattern }} / ${{ matrix.patch-dirs || 'no-patches' }}"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # rocm-6.2.4 against the 6.8 generic kernel — the original baseline
          - amdgpu-ref: rocm-6.2.4
            kernel-pattern: '6\.8\.'
            kernel-flavour: generic
            patch-dirs: ''

          # therock-7.14 against 6.8 generic, no patches
          - amdgpu-ref: therock-7.14
            kernel-pattern: '6\.8\.'
            kernel-flavour: generic
            patch-dirs: ''

          # therock-7.14 against 6.8 generic with the no-large-bar hipfile patches
          - amdgpu-ref: therock-7.14
            kernel-pattern: '6\.8\.'
            kernel-flavour: generic
            patch-dirs: './patches/amdgpu-no-large-bar'

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Detect available kernel headers version
        id: kver
        run: |
          KVER=$(apt-cache search "linux-headers-${{ matrix.kernel-pattern }}" | \
                 grep "${{ matrix.kernel-flavour }}" | \
                 sort -V | tail -1 | awk '{print $1}' | sed 's/linux-headers-//')
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            dkms \
            dwarves \
            linux-headers-${{ steps.kver.outputs.kver }}

      - name: Run the init-update script to populate src/
        run: ./scripts/init-update
        env:
          GIT_DEPTH: 1
          CHECK_OUT: 'no'

      - name: Fetch amdgpu remote
        run: git fetch amdgpu ${{ matrix.amdgpu-ref }}
        working-directory: ./src

      - name: Run build-amdgpu-dkms
        run: ./scripts/build-amdgpu-dkms
        env:
          KERNEL_VER: ${{ steps.kver.outputs.kver }}
          AMDGPU_REF: ${{ matrix.amdgpu-ref }}
          PATCH_DIRS: ${{ matrix.patch-dirs }}
          INSTALL: 'no'

      - name: Verify modules were built
        run: |
          dkms status | grep amdgpu
          find /var/lib/dkms/amdgpu -name "*.ko*" | sort

      - name: Build source DKMS .deb (MKDEB=yes)
        run: ./scripts/build-amdgpu-dkms
        env:
          KERNEL_VER: ${{ steps.kver.outputs.kver }}
          AMDGPU_REF: ${{ matrix.amdgpu-ref }}
          PATCH_DIRS: ${{ matrix.patch-dirs }}
          INSTALL: 'no'
          MKDEB: 'yes'

      - name: Verify .deb is Architecture:all with source tree
        run: |
          ls -lh amdgpu-dkms-*.deb
          dpkg-deb --info amdgpu-dkms-*.deb | grep -E "Architecture: all|Package:|Depends:"
          dpkg-deb --contents amdgpu-dkms-*.deb | grep "usr/src/amdgpu-"
