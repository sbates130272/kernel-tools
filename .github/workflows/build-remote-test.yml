name: build-remote-test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ktool/ktool/build_remote.py'
      - 'ktool/pyproject.toml'
      - 'config-scripts/**'

jobs:
  build-remote-test:
    name: build-remote-test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [localhost, wsl]
        include:
          - mode: localhost
            remote_name: localhost
            config_script: default
            wsl_mode: 'false'
            config_grep: CONFIG_BLK_DEV_NVME
          - mode: wsl
            remote_name: none
            config_script: wsl
            wsl_mode: 'true'
            config_grep: CONFIG_INFINIBAND

    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Install ktool
        run: pip install ./ktool

      - name: Install kernel build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            nasm \
            pahole

      - name: Cache kernel source tree
        id: kernel-src-cache
        uses: actions/cache@v4
        with:
          path: ./src
          key: kernel-src-stable-${{ runner.os }}-v1

      - name: Initialise kernel source
        if: steps.kernel-src-cache.outputs.cache-hit != 'true'
        run: ktool init-update --kernel-dir ./src --depth 1 --skip-launchpad --check-out

      - name: Generate default .config
        run: make defconfig && mv .config test-config
        working-directory: ./src

      - name: Run ktool build-remote (--no-build, localhost mode)
        if: matrix.mode == 'localhost'
        run: |
          ktool build-remote \
            --remote-name localhost \
            --config test-config \
            --config-script default \
            --label=-build-remote-localhost-test \
            --no-build \
            --no-install
        working-directory: ./src

      - name: Run ktool build-remote (--no-build, wsl mode)
        if: matrix.mode == 'wsl'
        run: |
          ktool build-remote \
            --config-script wsl \
            --label=-build-remote-wsl-test \
            --no-build \
            --no-install \
            --wsl-mode
        working-directory: ./src

      - name: Verify config-script fragment was applied
        run: grep "${{ matrix.config_grep }}" src/.config
