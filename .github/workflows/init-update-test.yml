name: init-update-test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ktool/ktool/init_update.py'
      - 'ktool/pyproject.toml'

jobs:
  init-update-test:
    name: init-update-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Install ktool
        run: pip install ./ktool

      - name: Run ktool init-update (skip Launchpad for CI speed)
        run: ktool init-update --kernel-dir ./src --depth 1 --skip-launchpad

      - name: Verify src/ is a valid git repo with expected remotes
        run: git -C src remote -v | grep linus

      - name: Idempotency check (second run)
        run: ktool init-update --kernel-dir ./src --depth 1 --skip-launchpad

      - name: Check out a WSL branch
        run: |
          ktool init-update \
            --kernel-dir ./src \
            --depth 1 \
            --skip-launchpad \
            --check-out
        env:
          # Override check-out branch via env doesn't apply here; the
          # test verifies the flag is accepted without error.
