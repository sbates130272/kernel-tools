name: userspace-build-test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'userspace/**'

jobs:
  userspace-build-test:
    name: userspace-build-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libbpf-dev \
            libdrm-dev \
            libmnl-dev \
            liburing-dev
      - name: Verify amdgpu-dmabuf-io Makefile structure (dry run)
        run: make -n
        working-directory: userspace/amdgpu-dmabuf-io
      - name: Build knod-xdp-test
        run: make
        working-directory: userspace/knod-xdp-test
