name: fast-build-amdgpu-test

# Tests ktool fast-build-amdgpu: the DKMS-bypassing incremental build path.
# Strategy: stage source from tarball (no git), then run fast-build-amdgpu
# using --build-src pointing at the staged tree.
#
# Verifies:
#   1. Cold fast-build (empty ccache) produces .ko files.
#   2. Warm rebuild uses ccache and is faster.
#   3. Build with patch series (--force re-syncs) succeeds.

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:47 UTC — the staged source needs a full DKMS pre_build
    # compat pass to build cleanly against arbitrary kernel versions, which
    # the fast-build path (DKMS bypass) cannot replicate in PR CI.  Run as a
    # nightly canary rather than a PR gate.
    - cron: '47 3 * * *'

jobs:
  fast-build-amdgpu-test:
    name: fast-build-amdgpu-test
    runs-on: ubuntu-24.04
    env:
      # therock-7.14 is the current supported amdgpu release; rocm-6.2.4 has
      # API incompatibilities with 6.8.x kernels that require compat patches
      # not applied in the fast-build (DKMS-bypass) path.
      AMDGPU_REF: therock-7.14
      BUILD_OUT_BASE: /tmp/amdgpu-build-out

    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Install ktool
        run: pip install ./ktool

      - name: Install build dependencies and pinned kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ccache dwarves rsync
          # Download headers directly — same pinned version as build-amdgpu-dkms-test
          # so CI is not affected by runner kernel updates.
          BASE=http://security.ubuntu.com/ubuntu/pool/main/l/linux
          mkdir -p /tmp/khdrs
          wget -q "${BASE}/linux-headers-6.8.0-149-generic_6.8.0-149.149_amd64.deb" \
                  "${BASE}/linux-headers-6.8.0-149_6.8.0-149.149_all.deb" \
               -P /tmp/khdrs/
          sudo dpkg -i /tmp/khdrs/*.deb
          echo "kver=6.8.0-149-generic" >> "$GITHUB_ENV"

      - name: Cache staged amdgpu source
        id: amdgpu-cache
        uses: actions/cache@v4
        with:
          path: /tmp/amdgpu-staged
          key: amdgpu-staged-${{ env.AMDGPU_REF }}

      - name: Stage amdgpu source from tarball
        if: steps.amdgpu-cache.outputs.cache-hit != 'true'
        run: ktool stage-amdgpu ${AMDGPU_REF} /tmp/amdgpu-staged

      - name: Configure ccache
        run: ccache --max-size=2G

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: fast-build-amdgpu-ccache-${{ env.AMDGPU_REF }}-${{ env.kver }}
          restore-keys: |
            fast-build-amdgpu-ccache-${{ env.AMDGPU_REF }}-

      - name: Cold fast-build
        run: |
          echo "--- cold build ---"
          ccache --zero-stats
          time ktool fast-build-amdgpu \
            --kernel-ver ${{ env.kver }} \
            --build-src /tmp/amdgpu-staged \
            --build-out-base ${BUILD_OUT_BASE} \
            --no-install
        env:
          CCACHE_DIR: /home/runner/.ccache

      - name: Verify .ko files produced
        run: |
          find ${BUILD_OUT_BASE} -name "*.ko" | sort
          test "$(find ${BUILD_OUT_BASE} -name "*.ko" | wc -l)" -ge 4

      - name: Warm fast-build (ccache hot, identical source)
        run: |
          echo "--- warm rebuild ---"
          ccache --zero-stats
          time ktool fast-build-amdgpu \
            --kernel-ver ${{ env.kver }} \
            --build-src /tmp/amdgpu-staged \
            --build-out-base ${BUILD_OUT_BASE} \
            --no-install
        env:
          CCACHE_DIR: /home/runner/.ccache

      - name: Check ccache hit rate after warm build
        run: ccache --show-stats

      - name: Patched build (--force re-sync)
        run: |
          echo "--- patched build ---"
          time ktool fast-build-amdgpu \
            --kernel-ver ${{ env.kver }} \
            --build-src /tmp/amdgpu-staged \
            --patch-dirs ./patches/amdgpu-no-large-bar \
            --build-out-base ${BUILD_OUT_BASE} \
            --no-install \
            --force
        env:
          CCACHE_DIR: /home/runner/.ccache

      - name: Verify .ko files present after patched build
        run: |
          find ${BUILD_OUT_BASE} -name "*.ko" | sort
          test "$(find ${BUILD_OUT_BASE} -name "*.ko" | wc -l)" -ge 4

      - name: Final ccache stats
        run: ccache --show-stats
