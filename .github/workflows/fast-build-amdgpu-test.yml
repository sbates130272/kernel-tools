name: fast-build-amdgpu-test

# Tests scripts/fast-build-amdgpu: the DKMS-bypassing incremental build path
# that keeps a persistent build directory and ccache to cut rebuild times.
#
# Verifies:
#   1. Cold build succeeds and produces .ko files.
#   2. Warm build (ccache hot, .o files present) completes faster.
#   3. Build with a patch series succeeds.
#   4. FORCE=yes triggers a clean re-sync and rebuild.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/fast-build-amdgpu'
      - 'scripts/build-amdgpu-dkms'
      - 'patches/amdgpu-no-large-bar/**'
      - 'docker/Dockerfile.amdgpu-dkms'

jobs:
  fast-build-amdgpu-test:
    name: fast-build-amdgpu-test
    runs-on: ubuntu-24.04
    env:
      AMDGPU_REF: rocm-6.2.4
      INSTALL: 'no'
      BUILD_OUT_BASE: /tmp/amdgpu-build-out

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Detect available kernel headers version
        id: kver
        run: |
          # rocm-6.2.4 supports the 6.8.x kernel series on Ubuntu 24.04
          KVER=$(apt-cache search 'linux-headers-6\.8\.' | grep generic | \
                 sort -V | tail -1 | awk '{print $1}' | sed 's/linux-headers-//')
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            dwarves \
            rsync \
            linux-headers-${{ steps.kver.outputs.kver }}

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: fast-build-amdgpu-ccache-${{ env.AMDGPU_REF }}-${{ steps.kver.outputs.kver }}-${{ github.sha }}
          restore-keys: |
            fast-build-amdgpu-ccache-${{ env.AMDGPU_REF }}-${{ steps.kver.outputs.kver }}-

      - name: Clone amdgpu source (full blobs for git archive)
        # init-update uses --filter=blob:none (partial clone) so git archive
        # can't retrieve individual file blobs — GitHub rejects object-ID
        # fetches with "upload-pack: not our ref".  Clone the amdgpu remote
        # directly with --depth=1 (no filter) so all blobs are local.
        run: |
          git clone --depth=1 --branch ${AMDGPU_REF} \
            https://github.com/ROCm/amdgpu.git /tmp/amdgpu-src

      - name: Debug kernel headers
        run: |
          echo "=== auto.conf CONFIG_DRM ==="
          KVER=$(apt-cache search 'linux-headers-6\.8\.' | grep generic | sort -V | tail -1 | awk '{print $1}' | sed 's/linux-headers-//')
          grep "^CONFIG_DRM=" /lib/modules/${KVER}/build/include/config/auto.conf || echo "CONFIG_DRM not found in auto.conf"
          echo "=== Makefile head (BUILD_OUT would have this symlinked) ==="
          ls -la /tmp/amdgpu-src/drivers/gpu/drm/amd/dkms/Makefile 2>/dev/null | head -2 || echo "not staged yet"

      - name: Cold fast-build (no patches)
        # Use KERNEL_DIR=/tmp/amdgpu-src (the full --depth=1 clone without
        # --filter) so git archive can read all blobs locally.  AMDGPU_REF=HEAD
        # resolves to the single commit that was checked out.
        run: |
          echo "--- cold build start ---"
          time ./scripts/fast-build-amdgpu
        env:
          KERNEL_VER: ${{ steps.kver.outputs.kver }}
          KERNEL_DIR: /tmp/amdgpu-src
          AMDGPU_REF: HEAD
          AMDGPU_REMOTE: origin
          INSTALL: ${{ env.INSTALL }}
          BUILD_OUT_BASE: ${{ env.BUILD_OUT_BASE }}
          CCACHE_DIR: ~/.ccache

      - name: Verify .ko files were produced
        run: |
          find ${{ env.BUILD_OUT_BASE }} -name "*.ko" | sort
          test "$(find ${{ env.BUILD_OUT_BASE }} -name "*.ko" | wc -l)" -ge 4

      - name: Warm fast-build (ccache hot, identical source)
        run: |
          echo "--- warm build start ---"
          time ./scripts/fast-build-amdgpu
        env:
          KERNEL_VER: ${{ steps.kver.outputs.kver }}
          KERNEL_DIR: /tmp/amdgpu-src
          AMDGPU_REF: HEAD
          AMDGPU_REMOTE: origin
          INSTALL: ${{ env.INSTALL }}
          BUILD_OUT_BASE: ${{ env.BUILD_OUT_BASE }}
          CCACHE_DIR: ~/.ccache

      - name: Check ccache hit rate after warm build
        run: |
          ccache --show-stats
          HIT_RATE=$(ccache --show-stats | awk '/Hits:/ {gsub(/[()%]/,"",$NF); print $NF}' | head -1)
          echo "ccache hit rate: ${HIT_RATE}%"

      - name: Fast-build with amdgpu-no-large-bar patches
        run: |
          echo "--- patched build start ---"
          time ./scripts/fast-build-amdgpu
        env:
          KERNEL_VER: ${{ steps.kver.outputs.kver }}
          KERNEL_DIR: /tmp/amdgpu-src
          AMDGPU_REF: HEAD
          AMDGPU_REMOTE: origin
          INSTALL: ${{ env.INSTALL }}
          BUILD_OUT_BASE: ${{ env.BUILD_OUT_BASE }}
          PATCH_DIRS: ./patches/amdgpu-no-large-bar
          CCACHE_DIR: ~/.ccache
          FORCE: 'yes'

      - name: Verify .ko files still present after patched build
        run: |
          find ${{ env.BUILD_OUT_BASE }} -name "*.ko" | sort
          test "$(find ${{ env.BUILD_OUT_BASE }} -name "*.ko" | wc -l)" -ge 4

      - name: Second patched build (warm — same patch set)
        run: |
          echo "--- warm patched build start ---"
          time ./scripts/fast-build-amdgpu
        env:
          KERNEL_VER: ${{ steps.kver.outputs.kver }}
          KERNEL_DIR: /tmp/amdgpu-src
          AMDGPU_REF: HEAD
          AMDGPU_REMOTE: origin
          INSTALL: ${{ env.INSTALL }}
          BUILD_OUT_BASE: ${{ env.BUILD_OUT_BASE }}
          PATCH_DIRS: ./patches/amdgpu-no-large-bar
          CCACHE_DIR: ~/.ccache

      - name: Show final ccache stats
        run: ccache --show-stats
