name: fast-build-amdgpu-test

# Tests ktool fast-build-amdgpu: the DKMS-bypassing incremental build path.
# Strategy: stage source from tarball (no git), then run fast-build-amdgpu
# using --build-src pointing at the staged tree.
#
# Verifies:
#   1. Cold fast-build (empty ccache) produces .ko files.
#   2. Warm rebuild uses ccache and is faster.
#   3. Build with patch series (--force re-syncs) succeeds.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ktool/ktool/fast_build_amdgpu.py'
      - 'ktool/ktool/stage_amdgpu.py'
      - 'ktool/ktool/build_amdgpu_dkms.py'
      - 'patches/amdgpu-no-large-bar/**'
      - 'ktool/pyproject.toml'

jobs:
  fast-build-amdgpu-test:
    name: fast-build-amdgpu-test
    runs-on: ubuntu-24.04
    env:
      AMDGPU_REF: rocm-6.2.4
      BUILD_OUT_BASE: /tmp/amdgpu-build-out

    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Fix git warning
        run: git config --global init.defaultBranch main

      - name: Install ktool
        run: pip install ./ktool

      - name: Detect kernel headers version
        id: kver
        run: |
          KVER="6.8.0-136-generic"
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            dwarves \
            rsync \
            linux-headers-${{ steps.kver.outputs.kver }}

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: fast-build-amdgpu-ccache-${{ env.AMDGPU_REF }}-${{ steps.kver.outputs.kver }}-${{ github.sha }}
          restore-keys: |
            fast-build-amdgpu-ccache-${{ env.AMDGPU_REF }}-${{ steps.kver.outputs.kver }}-

      - name: Stage amdgpu source from tarball
        run: ktool stage-amdgpu ${AMDGPU_REF} /tmp/amdgpu-staged

      - name: Cold fast-build
        run: |
          echo "--- cold build ---"
          ccache --zero-stats
          time ktool fast-build-amdgpu \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --build-out-base ${BUILD_OUT_BASE} \
            --no-install
        env:
          CCACHE_DIR: /home/runner/.ccache

      - name: Verify .ko files produced
        run: |
          find ${BUILD_OUT_BASE} -name "*.ko" | sort
          test "$(find ${BUILD_OUT_BASE} -name "*.ko" | wc -l)" -ge 4

      - name: Warm fast-build (ccache hot, identical source)
        run: |
          echo "--- warm rebuild ---"
          ccache --zero-stats
          time ktool fast-build-amdgpu \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --build-out-base ${BUILD_OUT_BASE} \
            --no-install
        env:
          CCACHE_DIR: /home/runner/.ccache

      - name: Check ccache hit rate after warm build
        run: ccache --show-stats

      - name: Patched build (--force re-sync)
        run: |
          echo "--- patched build ---"
          time ktool fast-build-amdgpu \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --patch-dirs ./patches/amdgpu-no-large-bar \
            --build-out-base ${BUILD_OUT_BASE} \
            --no-install \
            --force
        env:
          CCACHE_DIR: /home/runner/.ccache

      - name: Verify .ko files present after patched build
        run: |
          find ${BUILD_OUT_BASE} -name "*.ko" | sort
          test "$(find ${BUILD_OUT_BASE} -name "*.ko" | wc -l)" -ge 4

      - name: Final ccache stats
        run: ccache --show-stats
