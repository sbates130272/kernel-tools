name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Create release tarballs
        run: |
          tar czf "io-uring-dmabuf-patches-${{ github.ref_name }}.tar.gz" patches/io-uring-dmabuf/
          tar czf "knod-patches-${{ github.ref_name }}.tar.gz" patches/knod/
          tar czf "p2pdma-patches-${{ github.ref_name }}.tar.gz" patches/p2pdma/
          tar czf "amdgpu-no-large-bar-patches-${{ github.ref_name }}.tar.gz" patches/amdgpu-no-large-bar/
          tar czf "useful-configs-${{ github.ref_name }}.tar.gz" useful-configs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            io-uring-dmabuf-patches-*.tar.gz
            knod-patches-*.tar.gz
            p2pdma-patches-*.tar.gz
            amdgpu-no-large-bar-patches-*.tar.gz
            useful-configs-*.tar.gz
          generate_release_notes: true
