name: docker-fast-build-amdgpu-test

# Tests the Docker-based fast-build workflow via ktool fast-build-amdgpu --docker.
#
# Strategy:
#   1. Build the image via docker buildx bake (exercises the HCL and apt-cache mounts).
#   2. Stage amdgpu source from a GitHub tarball (no git).
#   3. Run ktool fast-build-amdgpu --docker (cold build).
#   4. Warm rebuild — must skip rsync+pre-build and complete quickly.
#   5. Patched build — apply amdgpu-no-large-bar patches, verify .ko output.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'docker/Dockerfile.amdgpu-dkms'
      - 'docker/amdgpu-dkms.hcl'
      - 'ktool/ktool/fast_build_amdgpu.py'
      - 'ktool/ktool/stage_amdgpu.py'
      - 'patches/amdgpu-no-large-bar/**'
      - 'ktool/pyproject.toml'

jobs:
  docker-fast-build-amdgpu-test:
    name: "${{ matrix.amdgpu-ref }} / ${{ matrix.kernel-pattern }}"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - amdgpu-ref: rocm-6.2.4
            kernel-pattern: '6\.8\.'
            kernel-flavour: generic
          - amdgpu-ref: therock-7.14
            kernel-pattern: '6\.8\.'
            kernel-flavour: generic

    env:
      AMDGPU_REF: ${{ matrix.amdgpu-ref }}
      BUILD_OUT_BASE: /tmp/amdgpu-build-out

    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Fix git default branch warning
        run: git config --global init.defaultBranch main

      - name: Install ktool
        run: pip install ./ktool

      - name: Detect latest available kernel headers
        id: kver
        run: |
          KVER=$(apt-cache search "linux-headers-${{ matrix.kernel-pattern }}" | \
                 grep "${{ matrix.kernel-flavour }}" | \
                 sort -V | tail -1 | awk '{print $1}' | sed 's/linux-headers-//')
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"
          echo "Kernel headers: ${KVER}"

      - name: Fetch latest upstream DKMS release tag
        id: dkms-ver
        run: |
          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/dell/dkms/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])" \
            2>/dev/null || echo "unknown")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            dkms \
            dwarves \
            rsync \
            linux-headers-${{ steps.kver.outputs.kver }}

      - name: Report versions
        run: |
          INSTALLED=$(dkms --version 2>/dev/null || dpkg -s dkms | grep ^Version | awk '{print $2}')
          {
            echo "## Version summary"
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Runner kernel headers | ${{ steps.kver.outputs.kver }} |"
            echo "| Installed DKMS | ${INSTALLED} |"
            echo "| Upstream DKMS release | ${{ steps.dkms-ver.outputs.tag }} |"
            echo "| amdgpu ref | ${AMDGPU_REF} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage amdgpu source from tarball
        run: ktool stage-amdgpu ${AMDGPU_REF} /tmp/amdgpu-staged

      - name: Build Docker image via buildx bake
        run: |
          time KERNEL_VER=${{ steps.kver.outputs.kver }} \
            docker buildx bake \
            --builder default \
            --load \
            -f docker/amdgpu-dkms.hcl

      - name: Verify image exists
        run: |
          docker image inspect \
            "amdgpu-dkms-build:${{ steps.kver.outputs.kver }}" \
            --format '{{.Id}} {{.Created}}'

      - name: Cold build via ktool fast-build-amdgpu --docker
        run: |
          echo "--- cold build ---"
          time ktool fast-build-amdgpu \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --build-out-base ${BUILD_OUT_BASE} \
            --no-install \
            --docker \
            --image amdgpu-dkms-build:${{ steps.kver.outputs.kver }}

      - name: Verify .ko files produced (cold)
        run: |
          docker run --rm \
            -v amdgpu-dkms-buildout:${BUILD_OUT_BASE} \
            alpine sh -c "find ${BUILD_OUT_BASE} -name '*.ko' | sort"
          KO_COUNT=$(docker run --rm \
            -v amdgpu-dkms-buildout:${BUILD_OUT_BASE} \
            alpine sh -c "find ${BUILD_OUT_BASE} -name '*.ko' | wc -l")
          echo ".ko count: ${KO_COUNT}"
          test "${KO_COUNT}" -ge 4

      - name: Warm rebuild via ktool fast-build-amdgpu --docker
        id: warm
        run: |
          echo "--- warm rebuild ---"
          START=$(date +%s)
          ktool fast-build-amdgpu \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --build-out-base ${BUILD_OUT_BASE} \
            --no-install \
            --docker \
            --image amdgpu-dkms-build:${{ steps.kver.outputs.kver }} \
            2>&1 | tee /tmp/warm-build.log
          ELAPSED=$(( $(date +%s) - START ))
          echo "elapsed=${ELAPSED}" >> "$GITHUB_OUTPUT"
          echo "Warm build elapsed: ${ELAPSED}s"

      - name: Assert warm build completed under 60s
        run: |
          ELAPSED="${{ steps.warm.outputs.elapsed }}"
          echo "Warm build: ${ELAPSED}s (limit 60s)"
          test "${ELAPSED}" -lt 60

      - name: Patched build (--force re-syncs + applies patches)
        run: |
          echo "--- patched build ---"
          ktool fast-build-amdgpu \
            --kernel-ver ${{ steps.kver.outputs.kver }} \
            --build-src /tmp/amdgpu-staged \
            --patch-dirs ./patches/amdgpu-no-large-bar \
            --build-out-base ${BUILD_OUT_BASE} \
            --no-install \
            --force \
            --docker \
            --image amdgpu-dkms-build:${{ steps.kver.outputs.kver }}

      - name: Verify .ko files after patched build
        run: |
          KO_COUNT=$(docker run --rm \
            -v amdgpu-dkms-buildout:${BUILD_OUT_BASE} \
            alpine sh -c "find ${BUILD_OUT_BASE} -name '*.ko' | wc -l")
          echo ".ko count after patched build: ${KO_COUNT}"
          test "${KO_COUNT}" -ge 4
